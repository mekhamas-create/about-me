<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Me</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #57d9c3 0%, #c9662e 100%);
    padding: 24px;
  }

  .card {
    background: #ffffff;
    max-width: 480px;
    width: 100%;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
  }

  .avatar {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: block;
    border: 5px solid #dfa515;
  }

  .name {
    font-size: 28px;
    color: #2b2b2b;
    margin-bottom: 4px;
  }

  .role {
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #dfa515;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .about {
    font-size: 15px;
    line-height: 1.7;
    color: #444;
    text-align: left;
  }

  .divider {
    width: 50px;
    height: 3px;
    background-color: #dfa515;
    border-radius: 2px;
    margin: 0 auto 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <!-- Simple inline SVG avatar (no external image needed) -->
    <svg class="avatar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="100" fill="#f4e3d7" />
      <circle cx="100" cy="85" r="42" fill="#d97757" />
      <path d="M30 190 Q100 120 170 190 Z" fill="#d97757" />
    </svg>

    <h1 class="name">Mekhyla Josaine Masucol</h1>
    <p class="role">3rd Year College &mdash; System Development Program</p>
    <div class="divider"></div>

    <p class="about">
        <center>
      Hi, I'm Mekhyla Josaine Masucol, a 3rd year College student taking System Development.
        </center>
    </p>
  </div>

</body>
</html>
